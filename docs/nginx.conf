# The site at https://stats.example.org/, in /srv/volleyball/site/ (the Site tab's "Dossier du site").
# Copy it to /etc/nginx/conf.d/volleyball.conf, its address and folders changed: docs/hosting.md#your-own-server.

# Viewers' reports of a moment: each body kept on a line of feedback.log, 5 a minute per visitor, 2 KB each.
limit_req_zone $binary_remote_addr zone=feedback:1m rate=5r/m;
log_format feedback escape=json '{"received":"$time_iso8601","report":"$request_body"}';

# A match's video/ folder opens to the cookie video_key that video_key.conf lists for it (the app writes it). Wrong
# keys: 10 a minute per visitor.
map_hash_bucket_size 256;
map $uri $video_match {
  default "";
  ~^/(?<video_folder>[^/]+)/video(/|$) $video_folder;
}
map "$video_match:$cookie_video_key" $video_ok {
  default 0;
  include /srv/volleyball/video_key.conf;
}
map $video_ok $video_root {
  1 /srv/volleyball/site;
  default /nonexistent;
}
map $video_ok $video_bad {
  1 "";
  default $binary_remote_addr;
}
limit_req_zone $video_bad zone=video:1m rate=10r/m;

# The build's hashed files and those loaded with their version (?v=) kept for good, images a day, the rest checked
# each time; the video's only in the viewer's browser.
map $request_uri $site_cache {
  ~/assets/ "public, max-age=31536000, immutable";
  "~[?&]v=" "public, max-age=31536000, immutable";
  "~\.(png|jpe?g|webp|svg|ico)(\?|$)" "public, max-age=86400";
  default "public, no-cache";
}
map $request_uri $video_cache {
  ~/assets/ "private, max-age=31536000, immutable";
  "~[?&]v=" "private, max-age=31536000, immutable";
  default "private, no-cache";
}

server {
  listen 80;
  server_name stats.example.org;
  root /srv/volleyball/site;
  # The site's text files come with a gzip copy, sent as it is.
  gzip_static on;
  gzip_vary on;
  add_header Cache-Control $site_cache;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  location / {
    try_files $uri $uri/ =404;
  }
  # Without the key, back to the page without the video, which asks the password.
  location ~ ^/[^/]+/video(/|$) {
    limit_req zone=video burst=10 nodelay;
    limit_req_status 429;
    root $video_root;
    add_header Cache-Control $video_cache always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri $uri/ @no_video;
  }
  location @no_video {
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    rewrite ^/([^/]+)/ /$1/?video=denied? redirect;
  }
  location = /feedback {
    limit_except POST { deny all; }
    limit_req zone=feedback burst=5 nodelay;
    client_max_body_size 2k;
    client_body_buffer_size 2k;
    access_log /srv/volleyball/feedback/feedback.log feedback;
    # Passed on so that nginx reads the body, which it then logs.
    proxy_pass http://127.0.0.1:8081;
  }
}

# Answers the reports 204, doing nothing else.
server {
  listen 127.0.0.1:8081;
  access_log off;
  return 204;
}
