<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f3;
  --surface: #ffffff;
  --surface-2: #f0efeb;
  --court: #ecebe6;
  --line: #e1e0d9;
  --line-strong: #b9b8ae;
  --ink: #141413;
  --ink-2: #4a4946;
  --muted: #6b6964;
  --accent: #2a78d6;
  --accent-ink: #1d5fb0;
  --accent-soft: rgba(42, 120, 214, 0.11);
  --left: #2a78d6;
  --right: #eb6834;
  --point: #0ca30c;
  --error: #d03b3b;
  --play: #9a9890;
  --serve: #2a78d6;
  --pass: #eb6834;
  --set: #1baf7a;
  --attack: #eda100;
  --relance: #e87ba4;
  --block: #008300;
  --dig: #6250d6;
  --floor: #9a9890;
  --net: #52514e;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --surface-2: #262624;
    --court: #262624;
    --line: #2f2f2c;
    --line-strong: #5a5953;
    --ink: #f0efec;
    --ink-2: #c8c7bd;
    --muted: #9a988f;
    --accent: #3987e5;
    --accent-ink: #7db1ef;
    --accent-soft: rgba(57, 135, 229, 0.18);
    --left: #3987e5;
    --right: #d95926;
    --play: #77756f;
    --serve: #3987e5;
    --pass: #d95926;
    --set: #199e70;
    --attack: #c98500;
    --relance: #d55181;
    --dig: #9085e9;
    --floor: #8e8c85;
    --net: #c3c2b7;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 20px; }
header { padding: 8px 4px 4px; }
.top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
h1 { font-size: 28px; line-height: 1.2; margin: 0; font-weight: 650; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.sub { margin: 6px 0 0; color: var(--ink-2); max-width: 680px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 24px 0 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 0; }
.stat dt { color: var(--ink-2); font-size: 13px; }
.stat dd { margin: 2px 0 0; font-size: 28px; font-weight: 650; line-height: 1.2; }
.stat dd small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; min-width: 0; }
h2 { font-size: 18px; margin: 0; font-weight: 650; }
.caption { color: var(--ink-2); margin: 4px 0 16px; }
.note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 8px; flex: none; }
.btn {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 8px 14px;
  cursor: pointer; white-space: nowrap; line-height: 1.2;
}
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; max-width: 100%; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); font-weight: 600; }
select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 7px 10px; cursor: pointer; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; }
.legend b { font-weight: 650; margin-right: 4px; color: var(--ink); }

/* Actions */
table { width: 100%; max-width: 720px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 0; border-bottom: 1px solid var(--line); }
th { font-size: 13px; font-weight: 500; color: var(--ink-2); text-align: right; padding: 0 8px 10px; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td:first-child { padding: 8px 0; }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { border-top: 1px solid var(--line-strong); border-bottom: 0; font-weight: 600; }
td.n { text-align: right; padding: 5px 0 5px 8px; }
.n button, .n span { display: inline-block; min-width: 48px; text-align: center; padding: 5px 10px; font-size: 16px; border-radius: 8px; }
.n button { border: 0; background: var(--accent-soft); color: var(--accent-ink); cursor: pointer; font-weight: 650; }
.n button:hover, .n button.on { background: var(--accent); color: #fff; }
.n span { color: var(--muted); }

/* Video, playlist, replay, rallies */
.watch { display: grid; gap: 20px; }
@media (min-width: 900px) { .watch { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.bar .label { flex: 1 1 260px; min-width: 0; color: var(--ink-2); }
.bar .label .now { display: block; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent-ink); }
.bar .label b { color: var(--ink); font-weight: 650; }
.bar .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.replay { margin: 0; min-width: 0; }
.replay svg, .chart svg { display: block; width: 100%; height: auto; }
.replay #now { margin: 8px 0 0; font-weight: 600; min-height: 22px; }
.court-labels { display: flex; justify-content: space-between; padding: 0 9%; font-size: 12px; color: var(--muted); }
h3 { font-size: 15px; margin: 24px 0 0; font-weight: 650; }
.rallies {
  position: relative; list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; max-height: 312px; overflow-y: auto;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}
.rallies button {
  width: 100%; height: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 8px 10px; cursor: pointer; display: grid; gap: 6px; align-content: start;
}
.rallies button:hover { border-color: var(--line-strong); background: var(--surface-2); }
.rallies button.on { border-color: var(--accent); background: var(--accent-soft); }
.rallies .head { display: flex; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rallies .head b { color: var(--ink); font-weight: 650; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font-size: 11px; font-weight: 650; line-height: 18px; padding: 0 6px; border-radius: 6px; color: var(--ink);
  background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: inset 2px 0 0 var(--c);
}
.empty { color: var(--muted); margin: 8px 0 0; }

/* Court chart */
.controls { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 12px; }
.chart { position: relative; max-width: 860px; margin: 8px auto 0; }
.chart .empty { position: absolute; inset: 0 0 24px; display: grid; place-items: center; margin: 0; pointer-events: none; }
.chart .empty span { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.court-floor { fill: var(--court); }
.court-line { stroke: var(--line-strong); stroke-width: 1.5px; fill: none; vector-effect: non-scaling-stroke; }
.zone-line { stroke: var(--line-strong); stroke-width: 1px; opacity: 0.45; vector-effect: non-scaling-stroke; }
.net { stroke: var(--ink-2); stroke-width: 3px; vector-effect: non-scaling-stroke; stroke-linecap: round; }
[role="button"] { cursor: pointer; }
/* Inside the SVG a CSS px is a court metre: marks show focus with their own stroke, not an outline. */
svg [role="button"]:focus-visible { outline: none; }
.dot circle.mark { stroke: var(--surface); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.dot text { font-size: 0.34px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.dot:hover circle.mark { stroke: var(--ink); }
.dot:focus-visible circle.mark { stroke: var(--accent); stroke-width: 3px; }
.hit { fill: transparent !important; stroke: transparent !important; }
.arrow line.hit { stroke-width: 0.8; }
.cell rect { fill: var(--accent); }
.cell text { font-size: 0.85px; text-anchor: middle; dominant-baseline: central; fill: var(--ink); pointer-events: none; font-weight: 650; }
.cell text.pct { font-size: 0.55px; font-weight: 400; fill: var(--ink-2); }
.cell text.num { font-size: 0.5px; font-weight: 400; fill: var(--muted); text-anchor: start; }
.cell:hover rect, .cell:focus-visible rect { stroke: var(--accent); stroke-width: 3px; vector-effect: non-scaling-stroke; }
.arrow line { stroke-width: 0.09; stroke-linecap: round; }
.arrow:hover, .arrow:focus-visible { opacity: 1 !important; }
.arrow:focus-visible line { stroke-width: 0.18; }
.point { stroke: var(--point); fill: var(--point); }
.error { stroke: var(--error); fill: var(--error); }
.play { stroke: var(--play); fill: var(--play); }
.arrow :is(polygon, circle, ellipse) { stroke: none; }
.arrow .landing { stroke: var(--surface); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.player { stroke: var(--surface); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.player.left { fill: var(--left); }
.player.right { fill: var(--right); }
.ball { fill: var(--ink); stroke: var(--surface); stroke-width: 2px; vector-effect: non-scaling-stroke; }

/* Rally charts */
.rally-charts { display: grid; gap: 28px; }
@media (min-width: 900px) { .rally-charts { grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); } }
.tl { position: relative; height: 140px; border-bottom: 1px solid var(--line-strong); }
.tl button { position: absolute; bottom: 0; border: 0; padding: 0; background: var(--accent); opacity: 0.75; border-radius: 3px 3px 0 0; cursor: pointer; min-width: 4px; }
.tl button:hover, .tl button:focus-visible, .tl button.on { opacity: 1; }
.tl .head { position: absolute; top: 0; bottom: -6px; width: 1px; background: var(--ink); pointer-events: none; }
.axis { position: relative; height: 22px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; }
.hist { display: flex; align-items: flex-end; gap: 6px; height: 140px; border-bottom: 1px solid var(--line-strong); }
.hist button { flex: 1; border: 0; padding: 0; background: none; cursor: pointer; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
.hist button:disabled { cursor: default; }
.hist i { display: block; width: 100%; max-width: 24px; background: var(--accent); opacity: 0.75; border-radius: 4px 4px 0 0; }
.hist button:not(:disabled):hover i { opacity: 1; }
.hist b { font-size: 12px; font-weight: 650; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.hist-axis { display: flex; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.hist-axis span { flex: 1; text-align: center; }
.axis-title { font-size: 12px; color: var(--muted); text-align: center; margin: 2px 0 0; }

@media (max-width: 599px) {
  .wrap { padding-top: 20px; gap: 16px; }
  section { padding: 18px 16px; border-radius: 16px; }
  h1 { font-size: 24px; }
  .stat dd { font-size: 24px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .n button, .n span { min-width: 40px; padding: 5px 6px; }
  th { padding: 0 4px 10px; }
  .controls .seg { display: flex; width: 100%; }
  .controls .seg button { flex: 1; padding: 6px 4px; white-space: normal; line-height: 1.2; }
  /* Court metres: bigger marks on a small court. */
  .dot circle.mark { r: 0.55px; }
  .dot text { font-size: 0.5px; }
  .player { r: 0.45px; }
  .ball { r: 0.38px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 id="name"></h1>
      <div class="seg" id="langs" role="group"></div>
    </div>
    <p class="sub" data-i18n="intro"></p>
    <dl class="stats" id="stats"></dl>
  </header>

  <section>
    <h2 data-i18n="actions"></h2>
    <p class="caption" data-i18n="actionsCaption"></p>
    <table id="actions"></table>
  </section>

  <section>
    <h2 data-i18n="video"></h2>
    <p class="caption" data-i18n="videoCaption"></p>
    <div class="watch">
      <div>
        <video id="video" controls playsinline preload="metadata"></video>
        <div class="bar">
          <div class="label" id="label" aria-live="polite"></div>
          <div class="buttons">
            <button class="btn" id="prev"></button>
            <button class="btn" id="next"></button>
            <button class="btn" id="stop"></button>
            <button class="btn primary" id="all"></button>
          </div>
        </div>
      </div>
      <figure class="replay">
        <svg id="replay" role="img"></svg>
        <div class="court-labels"><span data-i18n="leftEnd"></span><span data-i18n="cameraSide"></span><span data-i18n="rightEnd"></span></div>
        <p id="now"></p>
        <div class="legend">
          <span><i class="swatch" style="--c: var(--left)"></i><span data-i18n="leftTeam"></span></span>
          <span><i class="swatch" style="--c: var(--right)"></i><span data-i18n="rightTeam"></span></span>
          <span><i class="swatch" style="--c: var(--ink)"></i><span data-i18n="ball"></span></span>
        </div>
        <p class="note" id="replay-note"></p>
      </figure>
    </div>
    <h3 data-i18n="rallies"></h3>
    <ol class="rallies" id="rallies"></ol>
    <div class="legend" id="letters"></div>
  </section>

  <section>
    <h2 data-i18n="court"></h2>
    <p class="caption" id="court-caption"></p>
    <div class="controls">
      <div class="seg" id="views" role="group"></div>
      <select id="type"></select>
      <select id="side"></select>
      <button class="btn" id="reset" data-i18n="reset"></button>
      <button class="btn" id="play-shown"></button>
    </div>
    <div class="chart">
      <svg id="court" role="img"></svg>
      <div class="court-labels"><span data-i18n="leftEnd"></span><span data-i18n="cameraSide"></span><span data-i18n="rightEnd"></span></div>
      <p class="empty" id="court-empty" hidden><span></span></p>
    </div>
    <div class="legend" id="court-legend"></div>
    <p class="note" id="court-note"></p>
  </section>

  <section>
    <h2 data-i18n="rallies"></h2>
    <div class="rally-charts">
      <div>
        <p class="caption" data-i18n="timelineCaption"></p>
        <div class="tl" id="timeline"></div>
        <div class="axis" id="axis"></div>
      </div>
      <div>
        <p class="caption" data-i18n="histCaption"></p>
        <div class="hist" id="hist"></div>
        <div class="hist-axis" id="hist-axis"></div>
        <p class="axis-title" data-i18n="touchesPerRally"></p>
      </div>
    </div>
  </section>
</div>

<script src="data.js"></script>
<script>

  b.onclick = () => play(t('rallies'), M.rallies.map(rallyClip), r.i);
  return b;
});
const playhead = html('div', { class: 'head' }, $('timeline'));
{
  const minutes = M.duration / 60;
  const step = [1, 2, 5, 10, 15, 30, 60].find((s) => minutes / s <= 6) || 120;
  for (let m = 0; m <= minutes; m += step) {
    const x = (m * 60) / M.duration;
    html('span', { style: `left: ${100 * x}%${x > 0.95 ? '; transform: translateX(-100%)' : ''}` }, $('axis'), clock(m * 60));
  }
  const bins = ['0', '1', '2', '3', '4', '5', '6', '7+'];
  const of = (k) => M.rallies.filter((r) => Math.min(r.contacts.length, 7) === k);
  const top = Math.max(1, ...bins.map((_, k) => of(k).length));
  bins.forEach((k, i) => {
    const rallies = of(i);
    const touches = t('touchesK', { n: parseInt(k, 10), k });
    const label = `${t('ralliesN', { n: rallies.length })} · ${touches}`;
    const b = html('button', { title: label, 'aria-label': label }, $('hist'));
    b.disabled = !rallies.length;
    if (rallies.length) { html('b', {}, b, num(rallies.length)); }
    html('i', { style: `height: ${(100 * rallies.length) / top}%` }, b);
    b.onclick = () => play(t('ralliesWith', { touches }), rallies.map(rallyClip));
    html('span', {}, $('hist-axis'), k);
  });
}

// One loop drives the playlist, the replay, the playhead and the current rally from the video time.
let lastT = -1, lastRally = null;
function tick() {
  const time = video.currentTime;
  if (list && !video.paused && time >= list.clips[at].end) {
    if (at + 1 < list.clips.length) { go(at + 1); } else { video.pause(); stop(); }
  }
  if (time !== lastT) {
    lastT = time;
    renderReplay(time);
    playhead.style.left = `${(100 * time) / M.duration}%`;
    const r = rallyAt(time);
    const i = r ? r.i : null;
    if (i !== lastRally) {
      if (lastRally !== null) { rallyButtons[lastRally].classList.remove('on'); barButtons[lastRally].classList.remove('on'); }
      if (i !== null) {
        rallyButtons[i].classList.add('on');
        barButtons[i].classList.add('on');
        const box = $('rallies'), item = rallyButtons[i].parentNode;
        if (item.offsetTop < box.scrollTop || item.offsetTop + item.offsetHeight > box.scrollTop + box.clientHeight) { box.scrollTop = item.offsetTop - 8; }
      }
      lastRally = i;
    }
  }
  requestAnimationFrame(tick);
}
renderBar();
tick();
