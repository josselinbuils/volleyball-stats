[project]
name = "volleyball-stats"
version = "0.1.0"
description = "Automatic per-player volleyball statistics from match video"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "gdown",
    "numpy",
    "opencv-python",
    "rapidocr-onnxruntime>=1.4.4",
    # RapidOCR on the NVIDIA GPU, sharing torch's CUDA 13 libraries; elsewhere its own onnxruntime.
    "onnxruntime-gpu[cuda,cudnn]==1.31.0; sys_platform == 'linux'",
    "spandrel>=0.4.2",
    "torch",
    "ultralytics",
]

[project.scripts]
stats = "volleyball_stats.app:main"
# ponytail: the name of before, which launchers installed until 2026-11 start; the app rewrites them to `stats`.
volleyball-stats = "volleyball_stats.app:main"

[dependency-groups]
dev = ["pytest"]
bench = ["onnxruntime", "pillow", "pyyaml"]
voice = [
    "espeakng-loader>=0.2.4",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "phonemizer-fork>=3.3.2",
    "soundfile>=0.14.0",
]

[tool.uv]
# One onnxruntime per machine: both packages install the same module.
override-dependencies = ["onnxruntime; sys_platform != 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
