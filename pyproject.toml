[project]
name = "volleyball-stats"
version = "0.1.0"
description = "Automatic per-player volleyball statistics from match video"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "gdown",
    "numpy",
    "opencv-python",
    "rapidocr-onnxruntime>=1.4.4",
    "spandrel>=0.4.2",
    "torch",
    "ultralytics",
]

[dependency-groups]
dev = ["pytest"]
bench = ["onnxruntime", "pillow", "pyyaml"]
voice = [
    "espeakng-loader>=0.2.4",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "phonemizer-fork>=3.3.2",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
