[project]
name = "volleyball-stats"
version = "0.1.0"
description = "Automatic per-player volleyball statistics from match video"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["gdown", "numpy", "opencv-python", "torch"]

[dependency-groups]
dev = ["pytest"]
bench = ["onnxruntime", "pillow", "pyyaml", "torchvision", "ultralytics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
