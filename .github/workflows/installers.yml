# setup.exe and volleyball-stats.dmg, built on demand (Actions → Installers → Run workflow), kept as the run's files.
# The installers' version is the tag's (v1.2: 1.2), "dev" without one; the release's title "Volleyball Stats 1.2". With a release's tag, also put on that GitHub release (made if new, its text packaging/release/release.md): the
# download page, its links fixed (releases/latest/download/…).
name: Installers
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to publish to (empty: build only)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup.exe
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }
          $version = "${{ inputs.release }}".TrimStart("v"); if (-not $version) { $version = "dev" }
          iscc "/DVersion=$version" packaging\windows\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: volleyball-stats-setup
          path: packaging/windows/dist/volleyball-stats-setup.exe
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: volleyball-stats.dmg
        run: VERSION="$(echo "${{ inputs.release }}" | sed 's/^v//')" sh packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: volleyball-stats-dmg
          path: packaging/macos/dist/volleyball-stats.dmg
  release:
    if: inputs.release != ''
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        run: |
          # Its title: the app and the version (v1.2: "Volleyball Stats 1.2").
          title="Volleyball Stats ${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file packaging/release/release.md
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$title" --notes-file packaging/release/release.md --latest
          fi
